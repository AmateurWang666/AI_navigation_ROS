# cafe 地图的命名目的地。
#
# 文件名必须是「地图名.destinations.yaml」，放在地图旁边，会被自动加载：
#   maps/cafe.yaml
#   maps/cafe.pgm
#   maps/cafe.destinations.yaml   <-- 本文件
#
# 目的地跟着地图走是有意的：换一张地图就换一套目的地，两者天然对应，
# 不会出现「拿 A 图的坐标去 B 图导航」这种既不报错、结果又完全不对的情况。
#
# 用法：
#   rosrun ai_robot_nav send_goal hall
#   rosrun ai_robot_nav send_goal --list
#
# 格式为 [x, y, yaw]，坐标是**地图坐标系**下的米与弧度，yaw 可省略（默认 0）。
# 下面每个点都已确认落在地图的空闲区。启动时 map_manager 还会检查从起点
# 出发、在 allow_unknown=false 下是否栅格可达；不可达时会打印警告。
# 若 send_goal 报 Failed to find a valid plan，优先补建地图（见 README
# 「地图与导航安全」），不要永久把 allow_unknown 设为 true。
#
# 名字用 ASCII 只是为了在终端里好敲，中文名同样支持。

entrance:  [1.40,  3.125, 0.0]    # 出生点附近，机器人默认起步的位置
north:     [0.00,  1.000, 0.0]    # 北侧空地
hall:      [0.50, -3.500, 0.0]    # 大厅中央，两排桌子之间
window:    [0.50, -5.500, 1.57]   # 靠窗座位区，抵达后朝向 +y
west:      [-3.00, -2.000, 0.0]   # 西侧靠墙
east:      [3.00, -2.000, 0.0]    # 东侧靠墙

# 注意：cafe 的桌子在地图上看不见，这是正确的而不是缺陷。
# 桌子的碰撞体是 4.2 cm 见方的细立柱，比 5 cm 的栅格分辨率还小，
# 「射线擦过」的次数远多于命中，对数几率因此把它清成了空闲——
# 换 gmapping 建图结果也一样。它们由实时的局部代价地图负责规避，
# 这正是全局地图与局部地图的分工。规划目标点时仍应避开桌子实际所在的位置：
#   (0.5, -1.6)  (2.4, -5.5)  (-1.5, -5.5)  (2.4, -9)  (-1.5, -9)
