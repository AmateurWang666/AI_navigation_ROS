# 全局代价地图：覆盖整张用户地图，供全局规划器算出从当前位置到目标点的路径。
global_costmap:
  # 全局规划必须在 map 坐标系里做，否则里程计漂移会让规划出来的路径慢慢偏离
  # 真实环境。map -> odom 的修正由 amcl 发布。
  global_frame: map
  robot_base_frame: base_link

  # 全局地图是静态的，不需要高频重算。WSL 里 Gazebo 本就吃 CPU，
  # 这两个频率压低能明显减少卡顿，而全局路径每 0.5 s 更新一次完全够用。
  update_frequency: 2.0
  publish_frequency: 0.5
  transform_tolerance: 0.5

  # 尺寸与分辨率跟随 map_server 加载的地图，不在这里写死，
  # 这样换任何一张用户地图都不需要改本文件。
  static_map: true
  rolling_window: false

  plugins:
    - {name: static_layer,    type: "costmap_2d::StaticLayer"}
    - {name: obstacle_layer,  type: "costmap_2d::ObstacleLayer"}
    - {name: inflation_layer, type: "costmap_2d::InflationLayer"}

  static_layer:
    map_topic: /map
    subscribe_to_updates: true

  obstacle_layer:
    observation_sources: laser_scan_sensor
    laser_scan_sensor:
      sensor_frame: laser
      data_type: LaserScan
      topic: /scan
      marking: true
      clearing: true
      obstacle_range: 4.0
      raytrace_range: 5.0

  inflation_layer:
    inflation_radius: 0.45
    cost_scaling_factor: 5.0
