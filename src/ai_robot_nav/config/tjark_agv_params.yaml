# tjark_agv 仿真 / 实车专用参数。
#
# 话题映射来自 tjark_agv 包（不修改该包源码）：
#   - 激光：/scan
#   - 相机：/my_camera/color/image_raw
#   - 底盘：/cmd_vel（geometry_msgs/Twist，非 TwistStamped）
#
# 启动示例（ROS 1，步骤二完成后）：
#   roslaunch ai_robot_nav ai_nav.launch params_file:=$(rospack find ai_robot_nav)/config/tjark_agv_params.yaml use_sim_time:=true

ai_nav_node:
  scan_topic: "/scan"
  image_topic: "/my_camera/color/image_raw"
  cmd_topic: "/ai_cmd_vel"
  ollama_url: "http://localhost:11434/api/generate"
  ollama_model: "llava:7b"
  ollama_timeout: 30.0
  keep_alive: "30m"
  num_predict: 128
  temperature: 0.1
  inference_period: 1.0
  command_publish_rate: 10.0
  vision_ttl: 3.0
  max_retries: 2
  sensor_timeout: 1.0
  use_image: true
  image_width: 320
  image_height: 240
  jpeg_quality: 60
  front_half_angle: 30.0
  # tjark_agv 激光视场为传感器坐标 90°–270°，机器人正前方对应 180°。
  front_center_angle: 180.0
  rear_center_angle: 0.0
  side_center_angle: 90.0
  side_half_angle: 30.0
  cruise_speed: 0.15
  turn_speed: 0.45
  reverse_speed: 0.06
  reverse_clearance: 0.35
  forward_clearance: 0.70
  turn_clearance: 0.55
  trapped_distance: 0.35
  tie_threshold: 0.6
  caution_scale: 0.5
  caution_confirmations: 2
  lidar_only_fallback: true
  max_linear: 0.20
  max_angular: 1.2

safety_node:
  scan_topic: "/scan"
  ai_cmd_topic: "/ai_cmd_vel"
  cmd_topic: "/cmd_vel"
  cmd_stamped: false
  control_frequency: 20.0
  ai_cmd_timeout: 0.7
  scan_timeout: 0.5
  stop_distance: 0.24
  clear_distance: 0.34
  front_half_angle: 20.0
  front_center_angle: 180.0
  max_linear: 0.20
  max_angular: 1.2
  allow_reverse_in_emergency: true
  allow_rotate_in_emergency: true
  reverse_speed_limit: 0.08
  passthrough_mode: false
