# ai_robot_nav 默认参数（ROS 1）。
# tjark_agv 实车/仿真请改用 config/tjark_agv_params.yaml

ai_nav_node:
  scan_topic: "/scan"
  image_topic: "/camera/image_raw"
  cmd_topic: "/ai_cmd_vel"
  ollama_url: "http://localhost:11434/api/generate"
  ollama_model: "llava:7b"
  ollama_timeout: 30.0
  keep_alive: "30m"
  num_predict: 128
  temperature: 0.1
  inference_period: 1.0
  command_publish_rate: 10.0
  vision_ttl: 3.0
  max_retries: 2
  sensor_timeout: 1.0
  use_image: true
  image_width: 320
  image_height: 240
  jpeg_quality: 60
  front_half_angle: 30.0
  side_center_angle: 90.0
  side_half_angle: 30.0
  cruise_speed: 0.18
  turn_speed: 0.5
  reverse_speed: 0.08
  reverse_clearance: 0.4
  forward_clearance: 0.6
  turn_clearance: 0.5
  trapped_distance: 0.4
  tie_threshold: 0.3
  caution_scale: 0.5
  caution_confirmations: 2
  lidar_only_fallback: true
  max_linear: 0.22
  max_angular: 1.5

safety_node:
  scan_topic: "/scan"
  ai_cmd_topic: "/ai_cmd_vel"
  cmd_topic: "/cmd_vel"
  cmd_stamped: false
  control_frequency: 20.0
  ai_cmd_timeout: 0.7
  scan_timeout: 0.5
  stop_distance: 0.30
  clear_distance: 0.40
  front_half_angle: 20.0
  max_linear: 0.22
  max_angular: 1.5
  allow_reverse_in_emergency: true
  allow_rotate_in_emergency: true
  reverse_speed_limit: 0.1
  passthrough_mode: false
